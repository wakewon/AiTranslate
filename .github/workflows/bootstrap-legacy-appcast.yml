name: Bootstrap legacy appcast migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-legacy-appcast.yml

permissions:
  contents: write

concurrency:
  group: legacy-appcast-bootstrap
  cancel-in-progress: false

jobs:
  bridge-release:
    name: Publish one-time v1.0.2 update bridge
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --tags

      - name: Prepare v1.0.2 bridge source
        id: source
        run: |
          set -euo pipefail
          current_version=$(jq -r '.version' info.json)
          current_appcast=$(jq -r '.appcast' info.json)
          legacy_url='https://raw.githubusercontent.com/wakewon/AiTranslate/master/appcast.json'
          main_url='https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json'

          if [ "$current_version" = '1.0.1' ]; then
            test "$current_appcast" = "$legacy_url"
            jq --arg url "$main_url" '.version="1.0.2" | .appcast=$url' info.json > info.json.next
            mv info.json.next info.json
            if [ -f index.html ]; then
              sed -i '' 's/<div class="hero-badge">Bob Plugin v[^<]*<\/div>/<div class="hero-badge">Bob Plugin v1.0.2<\/div>/g' index.html
            fi
            git add info.json index.html
            git commit -m 'fix: repair appcast channel in v1.0.2'
            git push origin HEAD:main
          elif [ "$current_version" = '1.0.2' ]; then
            test "$current_appcast" = "$main_url"
          else
            echo "error: expected main at 1.0.1 or an in-progress 1.0.2 bridge, got $current_version" >&2
            exit 1
          fi

          if git rev-parse -q --verify refs/tags/v1.0.2 >/dev/null; then
            source_sha=$(git rev-list -n 1 v1.0.2)
            tag_version=$(git show v1.0.2:info.json | jq -r '.version')
            tag_appcast=$(git show v1.0.2:info.json | jq -r '.appcast')
            test "$tag_version" = '1.0.2'
            test "$tag_appcast" = "$main_url"
          else
            source_sha=$(git rev-parse HEAD)
            git tag v1.0.2 "$source_sha"
            git push origin refs/tags/v1.0.2
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build and publish v1.0.2 if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package='AiTranslate-v1.0.2.bobplugin'
          if ! gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            source_dir="$RUNNER_TEMP/v1.0.2-source"
            git worktree add --detach "$source_dir" v1.0.2
            (
              cd "$source_dir"
              ./build.sh
              test -f "release/$package"
              unzip -tq "release/$package"
              unpacked=$(mktemp -d)
              trap 'rm -rf "$unpacked"' EXIT
              unzip -q "release/$package" -d "$unpacked"
              test "$(jq -r '.version' "$unpacked/info.json")" = '1.0.2'
              test "$(jq -r '.appcast' "$unpacked/info.json")" = 'https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json'
            )
            gh release create v1.0.2 "$source_dir/release/$package" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title 'AiTranslate v1.0.2' \
              --notes 'Compatibility bridge release: fixes the appcast URL so existing installations migrate from the legacy master URL to the canonical main appcast. No translation-engine behavior changes.'
          fi

      - name: Update canonical main appcast from the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package='AiTranslate-v1.0.2.bobplugin'
          public_dir="$RUNNER_TEMP/public-release"
          rm -rf "$public_dir"
          mkdir -p "$public_dir"
          gh release download v1.0.2 --repo "$GITHUB_REPOSITORY" --pattern "$package" --dir "$public_dir"
          plugin_sha=$(shasum -a 256 "$public_dir/$package" | awk '{print $1}')
          published_at=$(gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')
          timestamp=$(jq -nr --arg published_at "$published_at" '$published_at | fromdateiso8601 * 1000 | floor')

          git fetch origin main
          git checkout -B main origin/main
          min_bob=$(jq -r '.minBobVersion // "1.8.0"' info.json)
          jq --arg sha "$plugin_sha" --arg minBob "$min_bob" --argjson timestamp "$timestamp" '
            .versions = ([{
              version:"1.0.2",
              desc:"AiTranslate 1.0.2 更新：修复自动更新通道",
              sha256:$sha,
              url:"https://github.com/wakewon/AiTranslate/releases/download/v1.0.2/AiTranslate-v1.0.2.bobplugin",
              minBobVersion:$minBob,
              timestamp:$timestamp
            }] + [.versions[] | select(.version != "1.0.2")])
          ' appcast.json > appcast.json.next
          mv appcast.json.next appcast.json
          git add appcast.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish appcast for v1.0.2'
            git push origin HEAD:main
          fi
          printf 'PLUGIN_SHA=%s\n' "$plugin_sha" >> "$GITHUB_ENV"

      - name: Create and freeze legacy master bridge
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          if git ls-remote --exit-code --heads origin master >/dev/null 2>&1; then
            git fetch origin master:refs/remotes/origin/master
            test "$(git show refs/remotes/origin/master:info.json | jq -r '.version')" = '1.0.2'
            test "$(git show refs/remotes/origin/master:info.json | jq -r '.appcast')" = 'https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json'
            git show refs/remotes/origin/master:appcast.json | jq -e --arg sha "$PLUGIN_SHA" '
              .versions[0].version=="1.0.2" and .versions[0].sha256==$sha
            ' >/dev/null
          else
            git push origin HEAD:refs/heads/master
          fi

      - name: Verify both update paths
        run: |
          set -euo pipefail
          main_appcast=$(curl -fsSL --retry 5 'https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json')
          master_appcast=$(curl -fsSL --retry 5 'https://raw.githubusercontent.com/wakewon/AiTranslate/master/appcast.json')
          for payload in "$main_appcast" "$master_appcast"; do
            printf '%s' "$payload" | jq -e --arg sha "$PLUGIN_SHA" '
              .versions[0].version=="1.0.2" and
              .versions[0].sha256==$sha and
              .versions[0].url=="https://github.com/wakewon/AiTranslate/releases/download/v1.0.2/AiTranslate-v1.0.2.bobplugin"
            ' >/dev/null
          done

      - name: Retire one-time bootstrap workflow from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/bootstrap-legacy-appcast.yml
          git commit -m 'chore: retire legacy appcast bootstrap'
          git push origin HEAD:main
