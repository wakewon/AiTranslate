name: Freeze legacy master release policy

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/freeze-master-release-policy.yml

permissions:
  contents: write

jobs:
  patch-release-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: dev

      - name: Remove future master updates from release workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()

          text = text.replace(
              '      - name: Push appcast and maintain legacy master appcast URL\n',
              '      - name: Push canonical main appcast\n',
              1,
          )

          legacy_block = '''\n          # Older published AiTranslate packages reference master/appcast.json.\n          # Keep a compatibility ref so those installations can discover the next release.\n          git fetch origin master:refs/remotes/origin/master 2>/dev/null || true\n          if git show-ref --verify --quiet refs/remotes/origin/master; then\n            git merge-base --is-ancestor refs/remotes/origin/master HEAD || {\n              echo "error: existing master branch has diverged; refusing to overwrite it" >&2\n              exit 1\n            }\n          fi\n          git push origin HEAD:master\n'''
          if text.count(legacy_block) != 1:
              raise SystemExit('expected exactly one legacy master push block')
          text = text.replace(legacy_block, '\n', 1)

          old_verify = '''          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"\n          for branch in main master; do\n            appcast_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/appcast.json"\n            matched=0\n            for _ in $(seq 1 30); do\n              remote=$(curl -fsSL "$appcast_url" 2>/dev/null || true)\n              if printf '%s' "$remote" | jq -e \\\n                --arg version "$VERSION" --arg sha "$PLUGIN_SHA" \\\n                --arg url "$expected_url" --arg minBob "$MIN_BOB_VERSION" \\\n                '.versions[0].version==$version and .versions[0].sha256==$sha and .versions[0].url==$url and .versions[0].minBobVersion==$minBob' \\\n                >/dev/null 2>&1; then\n                matched=1\n                break\n              fi\n              sleep 2\n            done\n            test "$matched" = 1 || {\n              echo "error: $branch appcast did not converge to v$VERSION" >&2\n              exit 1\n            }\n          done'''
          new_verify = '''          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"\n          appcast_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/appcast.json"\n          matched=0\n          for _ in $(seq 1 30); do\n            remote=$(curl -fsSL "$appcast_url" 2>/dev/null || true)\n            if printf '%s' "$remote" | jq -e \\\n              --arg version "$VERSION" --arg sha "$PLUGIN_SHA" \\\n              --arg url "$expected_url" --arg minBob "$MIN_BOB_VERSION" \\\n              '.versions[0].version==$version and .versions[0].sha256==$sha and .versions[0].url==$url and .versions[0].minBobVersion==$minBob' \\\n              >/dev/null 2>&1; then\n              matched=1\n              break\n            fi\n            sleep 2\n          done\n          test "$matched" = 1 || {\n            echo "error: main appcast did not converge to v$VERSION" >&2\n            exit 1\n          }'''
          if text.count(old_verify) != 1:
              raise SystemExit('expected exactly one dual-branch verification block')
          text = text.replace(old_verify, new_verify, 1)

          if 'HEAD:master' in text or 'for branch in main master' in text:
              raise SystemExit('master update behavior still present')

          path.write_text(text)
          PY

      - name: Commit release policy fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'ci: freeze master at the v1.0.2 migration bridge'
          git push origin HEAD:dev

      - name: Retire one-time policy patch
        run: |
          set -euo pipefail
          git rm .github/workflows/freeze-master-release-policy.yml
          git commit -m 'chore: retire master policy patch'
          git push origin HEAD:dev
