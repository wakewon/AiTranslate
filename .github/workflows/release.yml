name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public tag whose distribution steps should be resumed
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    name: Validate and build plugin candidate
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      min_bob_version: ${{ steps.identity.outputs.min_bob_version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      build_commit: ${{ steps.identity.outputs.build_commit }}
      package_name: ${{ steps.package.outputs.package_name }}
      candidate_sha: ${{ steps.package.outputs.candidate_sha }}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
          path: source

      - name: Validate tag and plugin identity
        id: identity
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"

          version=$(jq -r '.version' info.json)
          min_bob_version=$(jq -r '.minBobVersion' info.json)
          identifier=$(jq -r '.identifier' info.json)
          appcast=$(jq -r '.appcast' info.json)
          build_commit=$(git rev-list -n 1 "$RELEASE_TAG")

          test "$RELEASE_TAG" = "v$version"
          test "$build_commit" = "$(git rev-parse HEAD)"
          test "$identifier" = 'com.github.wakewon.ai.translate'
          test "$appcast" = 'https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json'
          test -n "$min_bob_version" && test "$min_bob_version" != null

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$build_commit" refs/remotes/origin/main || {
            echo "error: release tag must point to a commit already merged into main" >&2
            exit 1
          }

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'min_bob_version=%s\n' "$min_bob_version" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'build_commit=%s\n' "$build_commit" >> "$GITHUB_OUTPUT"

      - name: Validate source metadata and JavaScript
        run: |
          set -euo pipefail
          jq -e . info.json >/dev/null
          node --check main.js
          test ! -e icon.png
          default_icon=$(jq -r '.icons[] | select(.identifier == "default" and .type == "file") | .filePath' info.json)
          test -n "$default_icon" && test "$default_icon" != null && test -f "$default_icon"
          jq -e '
            ([.icons[].identifier] | unique) as $icons |
            [.options[] | select(.identifier == "serviceIcon") | .menuValues[].defaultPluginIconIdentifier] |
            all(. as $id | $icons | index($id) != null)
          ' info.json >/dev/null
          test -f .github/release-notes-template.md
          grep -q '{{VERSION}}' .github/release-notes-template.md
          grep -q '{{CHANGES}}' .github/release-notes-template.md
          grep -q '{{PACKAGE_NAME}}' .github/release-notes-template.md

      - name: Build and verify plugin package
        id: package
        run: |
          set -euo pipefail
          ./build.sh
          version='${{ steps.identity.outputs.version }}'
          package_name="AiTranslate-v$version.bobplugin"
          package="release/$package_name"
          test -f "$package"
          unzip -tq "$package"

          unpacked=$(mktemp -d)
          trap 'rm -rf "$unpacked"' EXIT
          unzip -q "$package" -d "$unpacked"
          jq -e --arg version "$version" '
            .identifier == "com.github.wakewon.ai.translate" and .version == $version and
            .appcast == "https://raw.githubusercontent.com/wakewon/AiTranslate/main/appcast.json"
          ' "$unpacked/info.json" >/dev/null
          test -f "$unpacked/main.js"
          test -f "$unpacked/README.md"
          test -f "$unpacked/tools/param-builder.html"
          default_icon=$(jq -r '.icons[] | select(.identifier == "default" and .type == "file") | .filePath' "$unpacked/info.json")
          test -f "$unpacked/$default_icon"

          candidate_sha=$(shasum -a 256 "$package" | awk '{print $1}')
          printf 'package_name=%s\ncandidate_sha=%s\n' "$package_name" "$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Transfer plugin candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: source/release/${{ steps.package.outputs.package_name }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: validate-build
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
      plugin_sha: ${{ steps.release.outputs.plugin_sha }}
    steps:
      - name: Checkout release notes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs['validate-build'].outputs.release_tag }}
          path: source

      - name: Receive plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: release

      - name: Verify transferred candidate
        env:
          PACKAGE_NAME: ${{ needs['validate-build'].outputs.package_name }}
          CANDIDATE_SHA: ${{ needs['validate-build'].outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test -f "release/$PACKAGE_NAME"
          actual=$(shasum -a 256 "release/$PACKAGE_NAME" | awk '{print $1}')
          test "$actual" = "$CANDIDATE_SHA"

      - name: Render standardized release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs['validate-build'].outputs.version }}
          RELEASE_TAG: ${{ needs['validate-build'].outputs.release_tag }}
          PACKAGE_NAME: ${{ needs['validate-build'].outputs.package_name }}
        run: |
          set -euo pipefail
          template='source/.github/release-notes-template.md'
          changes="$RUNNER_TEMP/release-changes.md"
          notes="$RUNNER_TEMP/release-notes.md"
          override="source/.github/release-notes/$RELEASE_TAG.md"

          if [ -f "$override" ]; then
            cp "$override" "$changes"
          else
            generated="$RUNNER_TEMP/generated-release-notes.md"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_TAG" \
              --jq '.body' > "$generated" 2>/dev/null; then
              python3 - "$generated" "$changes" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text().splitlines()
          bullets = []
          for line in source:
              stripped = line.strip()
              if stripped.startswith("* "):
                  bullets.append("- " + stripped[2:])
              elif stripped.startswith("- "):
                  bullets.append(stripped)
          Path(sys.argv[2]).write_text("\n".join(bullets) + ("\n" if bullets else ""))
          PY
            fi

            if [ ! -s "$changes" ]; then
              git -C source fetch --force --tags origin >/dev/null 2>&1 || true
              previous_tag=$(git -C source tag --sort=-version:refname --merged "$RELEASE_TAG" | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
              if [ -n "$previous_tag" ]; then
                git -C source log --no-merges --pretty='- %s' "$previous_tag..$RELEASE_TAG" > "$changes"
              else
                git -C source log -1 --pretty='- %s' "$RELEASE_TAG" > "$changes"
              fi
            fi
          fi

          test -s "$changes"
          VERSION="$VERSION" PACKAGE_NAME="$PACKAGE_NAME" CHANGES_FILE="$changes" TEMPLATE_FILE="$template" NOTES_FILE="$notes" \
            python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path(os.environ["TEMPLATE_FILE"]).read_text()
          changes = Path(os.environ["CHANGES_FILE"]).read_text().strip()
          rendered = (template
              .replace("{{VERSION}}", os.environ["VERSION"])
              .replace("{{PACKAGE_NAME}}", os.environ["PACKAGE_NAME"])
              .replace("{{CHANGES}}", changes))
          if "{{" in rendered or "}}" in rendered:
              raise SystemExit("error: unresolved release-note template placeholder")
          Path(os.environ["NOTES_FILE"]).write_text(rendered.rstrip() + "\n")
          PY

          printf 'notes_file=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Publish or safely resume GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs['validate-build'].outputs.version }}
          RELEASE_TAG: ${{ needs['validate-build'].outputs.release_tag }}
          PACKAGE_NAME: ${{ needs['validate-build'].outputs.package_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          set +x
          public_dir=$(mktemp -d)
          candidate_dir=$(mktemp -d)
          trap 'rm -rf "$public_dir" "$candidate_dir"' EXIT
          unzip -q "release/$PACKAGE_NAME" -d "$candidate_dir"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$draft" = true ]; then
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
              gh release create "$RELEASE_TAG" "release/$PACKAGE_NAME" \
                --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
                --title "Ai 翻译 v$VERSION - 一个插件搞定所有大模型翻译" \
                --notes-file "$NOTES_FILE"
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
            else
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$PACKAGE_NAME" --dir "$public_dir"
              public_unpacked=$(mktemp -d)
              unzip -q "$public_dir/$PACKAGE_NAME" -d "$public_unpacked"
              diff -qr "$candidate_dir" "$public_unpacked" >/dev/null || {
                echo "error: existing public Release asset contents differ from the tagged build" >&2
                exit 1
              }
              rm -rf "$public_unpacked"
            fi
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "error: recovery dispatch cannot create a missing public Release" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "release/$PACKAGE_NAME" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Ai 翻译 v$VERSION - 一个插件搞定所有大模型翻译" \
              --notes-file "$NOTES_FILE"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          fi

          rm -rf "$public_dir"
          mkdir -p "$public_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_NAME" --dir "$public_dir"
          plugin_sha=$(shasum -a 256 "$public_dir/$PACKAGE_NAME" | awk '{print $1}')
          published_at=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')
          test -n "$published_at" && test "$published_at" != null
          printf 'plugin_sha=%s\npublished_at=%s\n' "$plugin_sha" "$published_at" >> "$GITHUB_OUTPUT"

  update-appcast:
    name: Update canonical main appcast
    needs: [validate-build, publish-release]
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: main
    steps:
      - name: Checkout main release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
          path: main

      - name: Verify public asset and prepare appcast commit
        env:
          VERSION: ${{ needs['validate-build'].outputs.version }}
          MIN_BOB_VERSION: ${{ needs['validate-build'].outputs.min_bob_version }}
          RELEASE_TAG: ${{ needs['validate-build'].outputs.release_tag }}
          PACKAGE_NAME: ${{ needs['validate-build'].outputs.package_name }}
          PLUGIN_SHA: ${{ needs.publish-release.outputs.plugin_sha }}
          PUBLISHED_AT: ${{ needs.publish-release.outputs.published_at }}
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"
          public="$RUNNER_TEMP/$PACKAGE_NAME"
          curl -fL --retry 5 "$release_url" -o "$public"
          actual=$(shasum -a 256 "$public" | awk '{print $1}')
          test "$actual" = "$PLUGIN_SHA"

          timestamp=$(jq -nr --arg published_at "$PUBLISHED_AT" '$published_at | fromdateiso8601 * 1000 | floor')
          case "$timestamp" in
            ''|*[!0-9]*)
              echo "error: invalid Release published_at: $PUBLISHED_AT" >&2
              exit 1
              ;;
          esac

          scripts/update-appcast.sh "$VERSION" "$PLUGIN_SHA" "$timestamp" "$MIN_BOB_VERSION"
          git add appcast.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update appcast for v$VERSION"
          fi

      - name: Push canonical main appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          askpass="$RUNNER_TEMP/git-askpass.sh"
          printf '%s\n' \
            '#!/bin/bash' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$GH_TOKEN" ;;' \
            'esac' > "$askpass"
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          pushed=0
          for _ in 1 2 3; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main
          done
          test "$pushed" = 1

  verify-distribution:
    name: Verify public plugin distribution
    needs: [validate-build, publish-release, update-appcast]
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify Release asset and main appcast
        env:
          VERSION: ${{ needs['validate-build'].outputs.version }}
          MIN_BOB_VERSION: ${{ needs['validate-build'].outputs.min_bob_version }}
          RELEASE_TAG: ${{ needs['validate-build'].outputs.release_tag }}
          PACKAGE_NAME: ${{ needs['validate-build'].outputs.package_name }}
          PLUGIN_SHA: ${{ needs.publish-release.outputs.plugin_sha }}
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"
          curl -fL --retry 5 "$release_url" -o "$RUNNER_TEMP/$PACKAGE_NAME"
          actual=$(shasum -a 256 "$RUNNER_TEMP/$PACKAGE_NAME" | awk '{print $1}')
          test "$actual" = "$PLUGIN_SHA"

          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PACKAGE_NAME"
          appcast_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/appcast.json"
          matched=0
          for _ in $(seq 1 30); do
            remote=$(curl -fsSL "$appcast_url" 2>/dev/null || true)
            if printf '%s' "$remote" | jq -e \
              --arg version "$VERSION" --arg sha "$PLUGIN_SHA" \
              --arg url "$expected_url" --arg minBob "$MIN_BOB_VERSION" \
              '.versions[0].version==$version and .versions[0].sha256==$sha and .versions[0].url==$url and .versions[0].minBobVersion==$minBob' \
              >/dev/null 2>&1; then
              matched=1
              break
            fi
            sleep 2
          done
          test "$matched" = 1 || {
            echo "error: main appcast did not converge to v$VERSION" >&2
            exit 1
          }
